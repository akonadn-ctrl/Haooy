<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday, Soumia ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030003;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  color:white;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#030003;
}

/* =========================
   المشاهد
========================= */

.scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transform:scale(1.08);

  transition:
    opacity .9s ease,
    transform 1s ease,
    visibility .9s ease;
}

.scene.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:scale(1);
  z-index:10;
}

/* =========================
   النجوم
========================= */

.stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px white;
  animation:twinkle var(--duration) ease-in-out infinite;
  animation-delay:var(--delay);
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.5);
  }
  50%{
    opacity:1;
    transform:scale(1.6);
  }
}

/* =========================
   القلوب الطائرة
========================= */

.floating-heart{
  position:absolute;
  color:#ff174f;
  text-shadow:
    0 0 8px #ff174f,
    0 0 20px #ff174f;
  opacity:0;

  animation:
    floatHeart var(--speed) linear infinite;

  animation-delay:var(--delay);
}

@keyframes floatHeart{
  0%{
    transform:
      translateY(110vh)
      translateX(0)
      rotate(0deg)
      scale(.5);
    opacity:0;
  }

  10%{
    opacity:.9;
  }

  90%{
    opacity:.7;
  }

  100%{
    transform:
      translateY(-20vh)
      translateX(var(--move))
      rotate(360deg)
      scale(1.3);
    opacity:0;
  }
}

/* =========================
   المشهد 1
========================= */

#scene1{
  background:
    radial-gradient(
      circle at center,
      rgba(120,0,50,.65),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #030003,
      #260013,
      #030003
    );
}

.gift-card{
  position:relative;
  z-index:20;

  width:min(88vw,460px);
  padding:42px 25px;

  border:1px solid rgba(255,215,150,.45);
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(85,0,40,.9),
      rgba(10,0,12,.94)
    );

  box-shadow:
    0 0 30px rgba(180,0,65,.5),
    0 0 80px rgba(100,0,40,.2),
    inset 0 0 40px rgba(255,255,255,.04);

  text-align:center;

  backdrop-filter:blur(12px);

  cursor:pointer;

  animation:cardFloat 4s ease-in-out infinite;
}

.gift-card::before{
  content:"";
  position:absolute;
  inset:8px;

  border:1px solid rgba(255,215,150,.14);
  border-radius:24px;

  pointer-events:none;
}

@keyframes cardFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }
}

.gift-card:active{
  transform:scale(.96);
}

.gift-heart{
  width:105px;
  height:105px;

  margin:0 auto 32px;

  position:relative;

  transform:rotate(-45deg);

  background:
    linear-gradient(
      145deg,
      #ff315e,
      #780020
    );

  box-shadow:
    0 0 20px #ff174f,
    0 0 60px rgba(255,0,70,.65);

  animation:
    heartPulse 1.7s infinite ease-in-out;

  pointer-events:none;
}

.gift-heart::before,
.gift-heart::after{
  content:"";

  position:absolute;

  width:105px;
  height:105px;

  border-radius:50%;

  background:inherit;
}

.gift-heart::before{
  top:-52px;
  left:0;
}

.gift-heart::after{
  left:52px;
  top:0;
}

@keyframes heartPulse{
  0%,100%{
    transform:rotate(-45deg) scale(1);
  }

  50%{
    transform:rotate(-45deg) scale(1.1);
  }
}

.click-text{
  position:relative;
  z-index:5;

  font-size:clamp(25px,6vw,39px);

  font-weight:bold;

  color:white;

  text-shadow:
    0 0 15px white,
    0 0 30px #ff174f;

  direction:rtl;

  pointer-events:none;
}

.subtitle{
  position:relative;
  z-index:5;

  margin-top:15px;

  color:#d8bac5;

  font-size:14px;

  pointer-events:none;
}

/* =========================
   ورود المشهد
========================= */

.scene-number{
  position:absolute;
  top:25px;
  left:25px;

  font-size:12px;

  color:rgba(255,255,255,.35);

  z-index:20;
}

/* =========================
   المشهد 2
========================= */

#scene2{
  background:#030003;
}

.code-window{
  position:relative;

  width:min(92vw,800px);
  height:min(72vh,510px);

  background:#08090d;

  border:1px solid rgba(255,255,255,.16);

  border-radius:18px;

  box-shadow:
    0 0 70px rgba(160,0,55,.4);

  overflow:hidden;

  direction:ltr;
}

.window-bar{
  height:42px;

  background:#111217;

  display:flex;
  align-items:center;

  gap:8px;

  padding:0 15px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#555;
}

.dot:nth-child(1){
  background:#ff5f57;
}

.dot:nth-child(2){
  background:#ffbd2e;
}

.dot:nth-child(3){
  background:#28c840;
}

.code{
  padding:22px;

  color:#b8bdc8;

  font-family:monospace;

  font-size:clamp(10px,2vw,15px);

  line-height:1.7;
}

.code-line{
  opacity:0;
}

.scene2.active .code-line{
  animation:codeIn .45s forwards;
}

.code-line:nth-child(1){animation-delay:.2s;}
.code-line:nth-child(2){animation-delay:.5s;}
.code-line:nth-child(3){animation-delay:.8s;}
.code-line:nth-child(4){animation-delay:1.1s;}
.code-line:nth-child(5){animation-delay:1.4s;}
.code-line:nth-child(6){animation-delay:1.7s;}
.code-line:nth-child(7){animation-delay:2s;}
.code-line:nth-child(8){animation-delay:2.3s;}

@keyframes codeIn{
  to{
    opacity:1;
  }
}

.keyword{
  color:#ff6b9d;
}

.string{
  color:#e6d889;
}

.function{
  color:#82d8ff;
}

.code-heart{
  position:absolute;

  left:50%;
  top:56%;

  width:125px;
  height:125px;

  transform:
    translate(-50%,-50%)
    rotate(-45deg)
    scale(.1);

  border:4px solid #ff174f;

  box-shadow:
    0 0 10px #ff174f,
    0 0 35px #ff174f,
    inset 0 0 20px #ff174f;

  opacity:0;
}

.scene2.active .code-heart{
  animation:
    codeHeart 4s 1s forwards;
}

.code-heart::before,
.code-heart::after{
  content:"";

  position:absolute;

  width:125px;
  height:125px;

  border:4px solid #ff174f;

  border-radius:50%;
}

.code-heart::before{
  top:-65px;
  left:-4px;
}

.code-heart::after{
  left:60px;
  top:-4px;
}

@keyframes codeHeart{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      rotate(-45deg)
      scale(.1);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      rotate(-45deg)
      scale(1);
  }
}

.soumia-code{
  position:absolute;

  left:50%;
  top:56%;

  transform:translate(-50%,-50%);

  font-size:clamp(25px,7vw,55px);

  font-weight:bold;

  color:white;

  text-shadow:
    0 0 15px #ff174f,
    0 0 35px #ff174f;

  opacity:0;

  direction:ltr;
}

.scene2.active .soumia-code{
  animation:
    soumiaAppear 1s 5.1s forwards;
}

@keyframes soumiaAppear{
  to{
    opacity:1;
  }
}

/* =========================
   Matrix
========================= */

.matrix-scene{
  background:#000;
}

.matrix{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}

.matrix-column{
  position:absolute;

  top:-130%;

  color:#ff174f;

  font-family:monospace;

  font-size:clamp(13px,2vw,22px);

  line-height:1.2;

  writing-mode:vertical-rl;

  text-shadow:
    0 0 8px #ff174f;

  animation:
    matrixFall var(--fall) linear infinite;

  opacity:.7;
}

@keyframes matrixFall{
  to{
    transform:translateY(240vh);
  }
}

.matrix-center{
  position:relative;
  z-index:5;

  font-size:clamp(130px,35vw,300px);

  font-weight:900;

  color:white;

  text-shadow:
    0 0 10px white,
    0 0 30px #ff174f,
    0 0 80px #ff174f;

  animation:
    numberPulse .8s infinite alternate;
}

@keyframes numberPulse{
  from{
    transform:scale(.94);
  }

  to{
    transform:scale(1.05);
  }
}

/* =========================
   الخلفية الرومانسية
========================= */

.romantic-bg{
  background:
    radial-gradient(
      circle at center,
      rgba(110,0,45,.5),
      transparent 45%
    ),
    #050005;
}

/* =========================
   القلب الكبير
========================= */

.big-heart{
  position:relative;

  width:min(42vw,280px);
  height:min(42vw,280px);

  min-width:190px;
  min-height:190px;

  background:
    linear-gradient(
      145deg,
      #ff174f,
      #68001f
    );

  transform:rotate(-45deg);

  border-radius:10px;

  box-shadow:
    0 0 20px #ff174f,
    0 0 60px #ff174f,
    0 0 130px rgba(255,0,60,.55);

  animation:
    bigHeart 1.4s ease-in-out infinite alternate;
}

.big-heart::before,
.big-heart::after{
  content:"";

  position:absolute;

  width:100%;
  height:100%;

  background:inherit;

  border-radius:50%;
}

.big-heart::before{
  top:-50%;
  left:0;
}

.big-heart::after{
  left:50%;
  top:0;
}

@keyframes bigHeart{
  from{
    transform:rotate(-45deg) scale(1);
  }

  to{
    transform:rotate(-45deg) scale(1.08);
  }
}

.heart-name{
  position:absolute;

  z-index:5;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(45deg);

  width:280px;

  text-align:center;

  font-size:clamp(27px,7vw,52px);

  font-weight:bold;

  color:white;

  text-shadow:
    0 0 10px white,
    0 0 30px #ff174f;

  direction:ltr;
}

/* =========================
   الألعاب النارية
========================= */

.fireworks{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.firework{
  position:absolute;

  bottom:-20px;

  width:4px;
  height:4px;

  border-radius:50%;

  background:white;

  box-shadow:0 0 10px white;

  animation:
    fireworkLaunch 2.5s infinite ease-out;
}

.firework::after{
  content:"";

  position:absolute;

  width:100px;
  height:100px;

  left:-48px;
  top:-48px;

  border-radius:50%;

  border:2px solid rgba(255,30,80,.7);

  transform:scale(.1);

  opacity:0;

  animation:
    burst 2.5s infinite ease-out;
}

.firework:nth-child(1){
  left:12%;
}

.firework:nth-child(2){
  left:35%;
  animation-delay:.8s;
}

.firework:nth-child(3){
  left:55%;
  animation-delay:1.5s;
}

.firework:nth-child(4){
  left:78%;
  animation-delay:.4s;
}

@keyframes fireworkLaunch{
  0%{
    bottom:-20px;
    opacity:0;
  }

  15%{
    opacity:1;
  }

  55%{
    bottom:50%;
    opacity:1;
  }

  60%,100%{
    bottom:52%;
    opacity:0;
  }
}

@keyframes burst{
  55%{
    transform:scale(.1);
    opacity:0;
  }

  65%{
    transform:scale(1);
    opacity:1;
  }

  100%{
    transform:scale(1.8);
    opacity:0;
  }
}

/* =========================
   قلب I LOVE YOU
========================= */

.word-heart{
  position:relative;

  width:min(92vw,650px);
  height:min(78vh,530px);
}

.love-word{
  position:absolute;

  color:#ffb2c4;

  font-weight:bold;

  font-size:clamp(8px,1.7vw,15px);

  opacity:0;

  text-shadow:
    0 0 8px #ff174f;

  direction:ltr;

  white-space:nowrap;
}

.word-heart.active .love-word{
  animation:
    wordAppear .8s forwards;
}

@keyframes wordAppear{
  from{
    opacity:0;
    transform:scale(.2) rotate(-20deg);
  }

  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

/* =========================
   النصوص
========================= */

.text-scene{
  text-align:center;

  position:relative;

  z-index:5;

  width:92%;
}

.main-title{
  font-size:clamp(32px,8vw,75px);

  font-weight:900;

  line-height:1.25;

  direction:ltr;

  color:white;

  text-shadow:
    0 0 8px white,
    0 0 25px #ff174f,
    0 0 60px #ff174f;

  animation:
    titleGlow 2s infinite alternate;
}

.arabic-title{
  font-size:clamp(21px,5vw,42px);

  color:white;

  margin-top:22px;

  text-shadow:
    0 0 20px #ff174f;

  line-height:1.6;
}

@keyframes titleGlow{
  from{
    filter:brightness(.9);
  }

  to{
    filter:brightness(1.3);
  }
}

/* =========================
   القمر
========================= */

.moon{
  position:absolute;

  width:clamp(100px,18vw,180px);
  height:clamp(100px,18vw,180px);

  border-radius:50%;

  background:#fff5dc;

  box-shadow:
    0 0 25px white,
    0 0 80px rgba(255,245,220,.35);

  top:10%;
  left:10%;
}

.moon::after{
  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:#10000a;

  left:35px;
  top:-15px;
}

/* =========================
   النهائي
========================= */

.final-scene{
  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(125,0,45,.48),
      rgba(35,0,18,.8) 38%,
      #030003 78%
    );
}

.final-moon{
  position:absolute;

  width:clamp(110px,18vw,190px);
  height:clamp(110px,18vw,190px);

  top:7%;
  left:8%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #fff5d7 48%,
      #e8d8b7 100%
    );

  box-shadow:
    0 0 20px white,
    0 0 55px rgba(255,245,210,.5),
    0 0 110px rgba(255,245,210,.2);

  animation:
    moonFloat 7s ease-in-out infinite;

  z-index:2;
}

.final-moon::after{
  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:#12000a;

  left:35px;
  top:-14px;
}

@keyframes moonFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }
}

.heart-aura{
  position:absolute;

  width:min(65vw,470px);
  height:min(65vw,470px);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,0,70,.35),
      rgba(130,0,40,.12) 45%,
      transparent 70%
    );

  filter:blur(15px);

  animation:
    auraPulse 3s ease-in-out infinite;

  z-index:1;
}

@keyframes auraPulse{
  0%,100%{
    transform:scale(.9);
    opacity:.55;
  }

  50%{
    transform:scale(1.12);
    opacity:1;
  }
}

.final-big-heart{
  position:absolute;

  width:min(34vw,280px);
  height:min(34vw,280px);

  min-width:190px;
  min-height:190px;

  background:
    linear-gradient(
      145deg,
      #ff315e 0%,
      #d5003c 35%,
      #72001f 75%,
      #35000f 100%
    );

  transform:rotate(-45deg);

  border-radius:18px;

  box-shadow:
    0 0 15px #ff174f,
    0 0 40px #ff174f,
    0 0 90px rgba(255,0,70,.7),
    0 0 160px rgba(120,0,45,.5),
    inset -25px -25px 45px rgba(0,0,0,.45),
    inset 15px 15px 25px rgba(255,255,255,.12);

  animation:
    finalHeartPulse 3s ease-in-out infinite;

  z-index:3;
}

.final-big-heart::before,
.final-big-heart::after{
  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:inherit;
}

.final-big-heart::before{
  top:-50%;
  left:0;
}

.final-big-heart::after{
  top:0;
  left:50%;
}

@keyframes finalHeartPulse{
  0%,100%{
    transform:rotate(-45deg) scale(1);
  }

  50%{
    transform:rotate(-45deg) scale(1.08);
  }
}

.final-message{
  position:absolute;

  z-index:10;

  text-align:center;

  width:95%;

  pointer-events:none;
}

.final-title{
  font-size:clamp(28px,7vw,72px);

  font-weight:900;

  direction:ltr;

  color:white;

  letter-spacing:1px;

  text-shadow:
    0 0 8px #fff,
    0 0 20px #ff174f,
    0 0 45px #ff174f,
    0 0 90px rgba(255,0,70,.8);

  animation:
    finalTitleGlow 3s ease-in-out infinite;
}

.final-date{
  margin-top:22px;

  font-size:clamp(20px,4.5vw,38px);

  color:#f2d69b;

  direction:ltr;

  text-shadow:
    0 0 10px rgba(242,214,155,.7),
    0 0 25px rgba(242,214,155,.35);
}

.final-line{
  margin-top:20px;

  font-size:clamp(15px,3vw,25px);

  color:white;

  opacity:.85;

  text-shadow:0 0 10px #ff174f;
}

@keyframes finalTitleGlow{
  0%,100%{
    filter:brightness(.9);
  }

  50%{
    filter:brightness(1.35);
  }
}

/* =========================
   الورود النهائية
========================= */

.final-roses span{
  position:absolute;

  font-size:clamp(30px,6vw,65px);

  filter:
    drop-shadow(0 0 12px rgba(255,0,60,.8));

  z-index:6;

  animation:
    roseSway 4s ease-in-out infinite;
}

.final-roses span:nth-child(1){
  left:4%;
  bottom:7%;
}

.final-roses span:nth-child(2){
  right:4%;
  bottom:8%;
  animation-delay:1s;
}

.final-roses span:nth-child(3){
  left:12%;
  top:18%;
  font-size:35px;
  animation-delay:2s;
}

.final-roses span:nth-child(4){
  right:12%;
  top:22%;
  font-size:35px;
  animation-delay:1.5s;
}

@keyframes roseSway{
  0%,100%{
    transform:translateY(0) rotate(-5deg);
  }

  50%{
    transform:translateY(-12px) rotate(6deg);
  }
}

/* =========================
   القلوب النهائية
========================= */

.final-floating-heart{
  position:absolute;

  color:#ff174f;

  font-size:var(--heartSize);

  text-shadow:
    0 0 7px #ff174f,
    0 0 20px #ff174f;

  opacity:0;

  animation:
    finalHeartFloat var(--heartSpeed) linear infinite;

  animation-delay:var(--heartDelay);

  z-index:4;
}

@keyframes finalHeartFloat{
  0%{
    transform:
      translateY(110vh)
      translateX(0)
      rotate(0deg)
      scale(.5);

    opacity:0;
  }

  10%{
    opacity:.9;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:
      translateY(-15vh)
      translateX(var(--heartMove))
      rotate(360deg)
      scale(1.3);

    opacity:0;
  }
}

/* =========================
   ألعاب نارية النهاية
========================= */

.final-fireworks{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:7;
}

.final-firework{
  position:absolute;

  bottom:-20px;

  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 20px #ff174f;

  animation:
    fireworkRise 3.5s infinite ease-out;
}

.final-firework::before{
  content:"";

  position:absolute;

  width:5px;
  height:5px;

  left:0;
  top:0;

  border-radius:50%;

  box-shadow:
    0 -65px 0 #fff,
    0 65px 0 #ff174f,
    65px 0 0 #fff,
